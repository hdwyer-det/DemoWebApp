{% extends 'layout.html' %}
{% block content %}
<div class="container">
{% for row in content %}
<div class="card h-100">
  <div class="card-header">
    {{ row[1] }}
    </div>
  <div class="card-body" style="width: 18rem;">
      <img src="{{ row[4] }}" class="card-img-top" alt="Product image for the {{ row[1] }} VSCode extension.">
      <div class="card-body">
        <p class="card-text">{{ row[3] }}</p>
        <a href="{{ row[2] }}" class="btn btn-primary">Go somewhere</a>
      </div>
    </div>
  </div>
{% endfor %}
</div>
{% endblock %}
